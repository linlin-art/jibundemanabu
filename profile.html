<h1>『りんりん』という名前について</h1>
{% raw %}

<p>りんりん。</p>



<figure class="wp-block-image"><img style="display: block; width: auto; height: auto; max-width: 100%; max-height: 420px; object-fit: contain;" src="/jibundemanabu/assets/images/2019/09/preview3115024698034745520-885x1024.jpg" alt="" class="wp-image-1106"/><figcaption>I love you to the moon and back.</figcaption></figure>



<p>りんりんという名前は、去年悪性リンパ腫で天国に旅立ってしまった愛猫、凜からもらいました。</p>



<p>彼女は最後まで強くて優しい凜とした女の子でした。腎臓型のリンパ腫で治療をしても3ヶ月ぐらいしか生きられないと言われたのですが、8ヶ月も頑張ってくれました。</p>



<p>このサイト<a href="/jibundemanabu/">「自分で学ぶ中国語」</a>のロゴも彼女がモデルです。</p>
