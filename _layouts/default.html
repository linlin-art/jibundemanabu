<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #444444;
      font-family:
        "Yu Gothic", "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", Meiryo, sans-serif;
      font-size: 17px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    header {
      padding-top: 64px;
      background: #ffffff;
      text-align: center;
    }

    header h1 {
      margin: 0;
      padding: 0 20px;
      font-size: clamp(1.7rem, 5vw, 2.6rem);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.05em;
    }

    .site-title {
      color: #444444;
      text-decoration: none;
    }

    nav {
      margin-top: 52px;
      padding: 15px 20px;
      background: #293FA3;
    }

    nav a {
      display: inline-block;
      margin: 0 12px;
      padding: 4px 12px;
      border-radius: 3px;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    nav a:hover {
      background: #203080;
    }

    main {
      max-width: 900px;
      margin: 48px auto 64px;
      padding: 0 24px;
    }

    main h1,
    main h2,
    main h3 {
      line-height: 1.6;
    }

    main h1 {
      margin: 0 0 1em;
      font-size: 1.8rem;
      font-weight: 500;
    }

    main h2 {
      margin-top: 2em;
      padding-bottom: 0.35em;
      border-bottom: 3px solid #F0D83A;
      font-size: 1.4rem;
      font-weight: 600;
    }

    main h3 {
      margin-top: 1.8em;
      font-size: 1.15rem;
      font-weight: 600;
    }

    main a {
      color: #3048A5;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    main a:hover {
      text-decoration-thickness: 2px;
    }

    a:focus-visible {
      outline: 3px solid #3048A5;
      outline-offset: 4px;
    }

    nav a:focus-visible {
      outline-color: #ffffff;
    }

    main img {
      max-width: 100%;
      height: auto;
    }

    main pre {
      overflow-x: auto;
      padding: 16px;
      background: #f5f7f8;
    }

    footer {
      padding: 28px 20px;
      border-top: 1px solid #e5e5e5;
      color: #777777;
      text-align: center;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      body {
        font-size: 16px;
      }

      header {
        padding-top: 40px;
      }

      nav {
        margin-top: 32px;
      }

      main {
        margin-top: 32px;
        padding: 0 20px;
      }

      main h1 {
        font-size: 1.5rem;
      }

      main h2 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <a class="site-title" href="{{ '/' | relative_url }}">
        {{ site.title | escape }}
      </a>
    </h1>
    <nav aria-label="メインナビゲーション">
      <a href="{{ '/' | relative_url }}">ホーム</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    &copy; {{ site.time | date: "%Y" }} 自分で学ぶ中国語
  </footer>
</body>
</html>
